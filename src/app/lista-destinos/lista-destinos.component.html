<div class="container content">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <div class="card card-outline-secondary">
        <div class="card-header">
          <h3 class="mb-0">Whishlist</h3>
        </div>
        <div class="card-body">
          <app-form-destino-viaje (onItemAdded)="agregado($event)"></app-form-destino-viaje>
        </div>
      </div>
    </div>
  </div>

  <hr class="mb-5">

  <button type="button" class="btn btn-secondary mb-3" (click)="resetVotos()">Reset votos</button>

  <div class="row">
    <app-destino-viaje *ngFor="let d of destinos$ | async" [destino]="d"></app-destino-viaje>
  </div>

  <hr>
  <h5>Actividad</h5>
  <ul>
    <li *ngFor="let u of updates">{{ u }}</li>
  </ul>
</div>

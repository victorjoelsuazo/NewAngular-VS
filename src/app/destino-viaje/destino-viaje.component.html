<div class="card-content" style="cursor: pointer" (click)="elegir()">
  <div class="card-img">
    <img [src]="destino.imagenUrl" alt="">
    <span><h4>Destino</h4></span>
  </div>
  <div class="card-desc">
    <h3>{{ destino.nombre }}</h3>
    <p>Votos: <span class="d-inline-block" [@pulso]="destino.votes">{{ destino.votes }}</span></p>
    <button type="button" class="btn btn-sm btn-success" appTrackearClick data-trackear-tags="voto-positivo"
      (click)="voteUp(); $event.stopPropagation()">+1</button>
    <button type="button" class="btn btn-sm btn-warning" appTrackearClick data-trackear-tags="voto-negativo"
      (click)="voteDown(); $event.stopPropagation()">-1</button>
    <button type="button" class="btn btn-sm btn-danger" appTrackearClick data-trackear-tags="borrar"
      (click)="borrar(); $event.stopPropagation()">Borrar</button>
  </div>
</div>
